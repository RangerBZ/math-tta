[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-tta"
version = "0.1.0"
description = "A research prototype for verifier-guided self-training on math reasoning"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = [
    "transformers==4.57.3",
    "accelerate>=1.0,<2",
]
train = [
    "transformers==4.57.3",
    "accelerate>=1.0,<2",
    "peft>=0.15,<1",
    "datasets>=2.16,<=2.21.0",
    "tqdm>=4.66,<5",
]
test = []

[project.scripts]
math-tta = "math_tta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
