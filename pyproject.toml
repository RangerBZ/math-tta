[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-tta"
version = "0.1.0"
description = "A focused starter project for self-training and test-time adaptation on math reasoning"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = [
    "transformers>=4.51",
    "accelerate>=1.0",
]
test = []

[project.scripts]
math-tta = "math_tta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
